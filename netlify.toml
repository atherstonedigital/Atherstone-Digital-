# The blog moved to /insights with every slug (Phase 3 decision 8). The specific rules sit above /blog/:slug.
[[redirects]]
  from = "/blog"
  to = "/insights"
  status = 301
  force = true

[[redirects]]
  from = "/blog/ai-writing-tells"
  to = "/insights/ai-writing-tells"
  status = 301
  force = true

[[redirects]]
  from = "/blog/category/*"
  to = "/insights"
  status = 301
  force = true

[[redirects]]
  from = "/blog/:slug"
  to = "/insights/:slug"
  status = 301
  force = true


# Earlier rules, repointed at their final pages so none is a chain.
[[redirects]]
  from = "/fractional-ecommerce-director"
  to = "/ecommerce-director"
  status = 301
  force = true

[[redirects]]
  from = "/why-fractional"
  to = "/agency-or-in-house"
  status = 301
  force = true

[[redirects]]

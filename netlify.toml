[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"

# Domain redirect (non-www to www) is handled by Netlify Domain Management.
# Set www.atherstonedigital.com as the PRIMARY domain in:
# Netlify Dashboard, Domain management, Set as primary domain

# Redirects: every rule is a 301 and mirrors lib/content/redirects.ts one for one, in the same order (that file says
# why each exists). Netlify reads them top to bottom and the first match wins. Every target is a page or file the
# static export builds, so no redirect leads to another redirect.

# The plan's redirect map (Technical SEO, Redirect map).
[[redirects]]
  from = "/shopify-ecommerce-consultant"
  to = "/ecommerce-director"
  status = 301
  force = true

